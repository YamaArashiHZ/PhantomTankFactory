version: 2
updates:
  # Rust 后端：低频、按 CRATE 分组，仅忽略大版本
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      tauri-rust:
        patterns:
          - "tauri"
          - "tauri-build"
          - "tauri-plugin-*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # npm 前端：低频、JS 侧按 Tauri / 构建链分组，忽略高 churn 的 @types/node
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      tauri-js:
        patterns:
          - "@tauri-apps/*"
        update-types:
          - "minor"
          - "patch"
      build-tooling:
        patterns:
          - "vite"
          - "@vitejs/plugin-vue"
          - "vue-tsc"
          - "vitest"
          - "typescript"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@types/node"
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
