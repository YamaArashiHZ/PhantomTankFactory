name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.1.2，自动写入 tauri.conf.json 并创建 tag）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "版本号格式不正确: $v（应为 x.y.z）"
            exit 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 将版本写入 tauri.conf.json
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.version = "${{ steps.ver.outputs.version }}"
          $json | ConvertTo-Json -Depth 32 | Set-Content $path -Encoding UTF8

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 前端测试
        run: pnpm test

      - name: Rust 测试
        working-directory: src-tauri
        run: cargo test

      # tauri-action 会：构建 → 签名 → 生成 latest.json → 创建 Release 并上传全部产物
      - name: 构建并发布（tauri-action）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: "PhantomTank Factory v__VERSION__"
          releaseDraft: false
          prerelease: false
          args: "--bundles nsis"
